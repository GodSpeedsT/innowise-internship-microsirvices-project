services:
  api-gateway:
    container_name: api-gateway
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - auth-service
      - user-service
      - order-service
    networks:
      - innowise_network

  user-service:
    container_name: user-service
    build:
      context: ./user-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    env_file:
      - ./user-service/envs/user-service.config.env
      - ./user-service/envs/user-service.secret.env
    depends_on:
      - users-db
      - users-redis
    networks:
      - innowise_network

  users-db:
    container_name: users-db
    image: postgres:latest
    env_file:
      - ./user-service/k8s/db/envs/users-db.secret.env
    ports:
      - "5432:5432"
    volumes:
      - users_data:/var/lib/postgresql
    networks:
      - innowise_network

  users-redis:
    container_name: users-redis
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - innowise_network

  order-service:
    container_name: order-service
    build:
      context: ./order-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    env_file:
      - ./order-service/envs/order-service.config.env
      - ./order-service/envs/order-service.secret.env
    depends_on:
      - order-db
    networks:
      - innowise_network

  order-db:
    container_name: order-db
    image: postgres:latest
    env_file:
      - ./order-service/k8s/db/envs/order-db.secret.env
    ports:
      - "5434:5432"
    volumes:
      - order_data:/var/lib/postgresql
    networks:
      - innowise_network

  payment-service:
    container_name: payment-service
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    env_file:
      - ./payment-service/envs/payment-service.config.env
      - ./payment-service/envs/payment-service.secret.env
    depends_on:
      - mongo-db
    networks:
      - innowise_network

  mongo-db:
    container_name: mongo-db
    image: mongo:latest
    restart: unless-stopped
    env_file:
      - ./payment-service/k8s/db/envs/payments-db.secret.env
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - innowise_network

  auth-service:
    container_name: auth-service
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    env_file:
      - ./auth-service/envs/auth-service.config.env
      - ./auth-service/envs/auth-service.secret.env
    depends_on:
      - auth-db
    networks:
      - innowise_network

  auth-db:
    container_name: auth-db
    image: postgres:latest
    env_file:
      - ./auth-service/k8s/db/envs/auth-db.secret.env
    ports:
      - "5433:5432"
    volumes:
      - auth_data:/var/lib/postgresql
    networks:
      - innowise_network

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    networks:
      - innowise_network

volumes:
  users_data:
  auth_data:
  order_data:
  redis_data:
  mongo_data:
  mongo_config:

networks:
  innowise_network:
    driver: bridge